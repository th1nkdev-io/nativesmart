name: Deploy Lab

# ── push dev → NativeSmart Lab (port hôte 3020, derrière le reverse-proxy)
#
# Sécurité (dépôt public) :
#   - seul un push sur dev déclenche ce workflow : il faut un accès en écriture au dépôt ;
#   - les pull requests venues de forks ne lancent jamais ce fichier et n'ont aucun secret ;
#   - les secrets SSH vivent dans l'environnement « lab », limité à la branche dev ;
#   - l'image ne contient aucun secret : c'est un site statique servi par nginx sans privilèges.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-lab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.0"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/th1nkdev-io/nativesmart-lab

jobs:
  # ── 1. Quality (format + build + typecheck + lint + tests) ─────────────────
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check

  # ── 2. Build & push (tag = nom de branche + sha) ───────────────────────────
  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: read
    # Environnement protégé : secrets SSH réservés à dev (approbation manuelle si configurée)
    environment: lab
    steps:
      - name: Resolve target
        id: vars
        run: |
          echo "container=ns_lab"  >> $GITHUB_OUTPUT
          echo "host_port=3020"    >> $GITHUB_OUTPUT
          echo "cpus=0.5"          >> $GITHUB_OUTPUT
          echo "mem=128m"          >> $GITHUB_OUTPUT
          echo "logmax=50m"        >> $GITHUB_OUTPUT
          echo "logfiles=5"        >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA,GH_TOKEN
          script_stop: false
          script: |
            set -e
            IMAGE_BASE="ghcr.io/th1nkdev-io/nativesmart-lab"
            TAG="${{ github.ref_name }}"
            CONTAINER="${{ steps.vars.outputs.container }}"
            HOST_PORT="${{ steps.vars.outputs.host_port }}"

            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Snapshot rollback ──
            docker tag "${IMAGE_BASE}:${TAG}" "${IMAGE_BASE}:${TAG}-rollback" 2>/dev/null || true

            # ── Pull & retag ──
            docker pull "${IMAGE_BASE}:${DEPLOY_SHA}"
            docker tag "${IMAGE_BASE}:${DEPLOY_SHA}" "${IMAGE_BASE}:${TAG}"
            docker logout ghcr.io

            # ── Remplace le conteneur (publié sur 127.0.0.1 → reverse-proxy hôte) ──
            # Système de fichiers en lecture seule, aucune capacité, aucun gain de privilèges.
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm   "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --read-only --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges \
              -p 127.0.0.1:${HOST_PORT}:8080 \
              --cpus=${{ steps.vars.outputs.cpus }} --memory=${{ steps.vars.outputs.mem }} \
              --log-driver json-file \
              --log-opt max-size=${{ steps.vars.outputs.logmax }} \
              --log-opt max-file=${{ steps.vars.outputs.logfiles }} \
              "${IMAGE_BASE}:${TAG}"

            # ── Health check ──
            echo "Health check..."
            for i in $(seq 1 30); do
              if docker exec "$CONTAINER" wget -qO- http://localhost:8080/healthz >/dev/null 2>&1; then
                echo "✅ Healthy (attempt $i)"
                docker image prune -f
                exit 0
              fi
              echo "  attempt $i — not ready"
              sleep 2
            done
            echo "❌ Health check failed — triggering rollback"
            exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script_stop: true
          script: |
            set -e
            IMAGE_BASE="ghcr.io/th1nkdev-io/nativesmart-lab"
            TAG="${{ github.ref_name }}"
            CONTAINER="${{ steps.vars.outputs.container }}"
            HOST_PORT="${{ steps.vars.outputs.host_port }}"
            echo "⚠️  Rolling back lab ($TAG)..."
            docker tag "${IMAGE_BASE}:${TAG}-rollback" "${IMAGE_BASE}:${TAG}" 2>/dev/null || true
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm   "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --read-only --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges \
              -p 127.0.0.1:${HOST_PORT}:8080 \
              --cpus=${{ steps.vars.outputs.cpus }} --memory=${{ steps.vars.outputs.mem }} \
              --log-driver json-file \
              --log-opt max-size=${{ steps.vars.outputs.logmax }} \
              --log-opt max-file=${{ steps.vars.outputs.logfiles }} \
              "${IMAGE_BASE}:${TAG}"
            echo "✅ Rollback done"
